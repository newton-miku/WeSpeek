<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Disable browser caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_client">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WeSpeek</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Loading Spinner */
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1E1E1E; /* AppColors.bgPrimary */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top: 4px solid #64B5F6; /* AppColors.accent */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      margin-top: 16px;
      color: #E0E0E0; /* AppColors.textPrimary */
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="loading-text">加载资源中...</div>
    <div class="loading-text">（首次加载可能耗时较长）</div>
  </div>
  <script>
    window.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    }, false);

    // Remove loading indicator when app is ready
    // We can listen for an event or just let Flutter cover it.
    // However, Flutter web might take time to render first frame.
    // We'll add a small script to remove it after some time or wait for Flutter.
    // Ideally, Flutter app should remove it, but for now we rely on Flutter mounting over it?
    // No, we should remove it.
    // Let's rely on Flutter rendering to cover it, but z-index 9999 might be on top.
    // We need a way to hide it.
    // We can expose a function to window and call it from Dart.
    window.hideLoadingIndicator = function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 500);
      }
    };
  </script>
  <script src="assets/js/rnnoise/rnnoise.js"></script>
  <script src="assets/js/rnnoise_bridge.js" type="module"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WeSpeek语音</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="panel sidebar">
      <header>
        <h2>房间列表</h2>
        <div id="serverName" class="server-name">WeSpeek 服务器</div>
      </header>
      <div class="rooms" id="roomsTree"></div>
    </aside>
    <main class="panel content">
      <header>
        <div class="row">
          <button id="menuBtn" class="icon-btn mobile-only">☰</button>
          <div class="title">当前房间：<span id="curRoom">未加入</span></div>
          <span id="connStatus" class="status warn">未连接</span>
        </div>
        <div class="controls">
          <input id="uid" placeholder="用户ID" />
          <button id="renameUid" class="secondary">重命名</button>
          <select id="mic"></select>
          <button id="disableInput" class="secondary">禁用输入</button>
          <button id="disableOutput" class="secondary">禁用输出</button>
          <button id="leave" class="secondary" disabled>离开</button>
        </div>
      </header>
      <section class="grid">
        <section class="subpanel">
          <h3>房间内成员</h3>
          <div id="members" class="list"></div>
        </section>
      <section class="subpanel">
        <h3>聊天</h3>
        <div class="tabs">
          <button class="tab active" id="tabPublic">大厅</button>
          <button class="tab" id="tabRoom" style="display:none;">房间</button>
        </div>
        <div id="chatList" class="list"></div>
        <div class="row">
          <textarea id="chatText" class="chat-input" placeholder="输入消息，Enter发送，Shift+Enter换行"></textarea>
          <button id="sendChat" class="chat-send">发送</button>
        </div>
      </section>
      </section>
    </main>
    <div class="float-audio" id="floatAudio">
      <div class="float-btn" id="floatBtn" title="音频控制">🎙️</div>
      <div class="float-menu">
        <div class="menu-row"><label>麦克风增益 <span id="inputGainVal" style="font-size:12px;color:#aaa;margin-left:4px">100%</span></label><input id="inputGain" class="vol-slider" type="range" min="0" max="200" value="100" /></div>
        <div class="menu-row"><label>总体输出音量 <span id="masterVolVal" style="font-size:12px;color:#aaa;margin-left:4px">100%</span></label><input id="masterVol" class="vol-slider" type="range" min="0" max="100" value="100" /></div>
        <div class="menu-row"><label>降噪模式</label>
          <select id="noiseMode" style="width:100px;padding:2px;">
            <option value="none">无</option>
            <option value="gate">阈值截断</option>
            <option value="smart">智能降噪</option>
            <option value="smart_gain">智能降噪增益</option>
          </select>
        </div>
        <div class="menu-row" id="gateControls" style="display:none;">
            <button id="calibrateBtn" style="width:100%;font-size:12px;padding:4px;">自动设置阈值</button>
        </div>
      </div>
    </div>
    <div id="roomSettingsModal" class="modal" style="display:none;">
      <div class="modal-content" style="width:420px;">
        <h3>房间设置</h3>
        <div class="row">
          <label style="width:120px;">音频编码</label>
          <select id="roomCodec" style="flex:1;">
            <option value="opus">Opus</option>
            <option value="pcm16">PCM16</option>
            <option value="pcmf32">PCM Float32</option>
            <option value="ima_adpcm">IMA-ADPCM</option>
          </select>
        </div>
        <div class="row">
          <label style="width:120px;">音频质量</label>
          <input id="roomQuality" type="range" min="1" max="10" value="6" style="flex:1;">
          <span id="roomQualityVal" style="width:40px;text-align:right;">6</span>
        </div>
        <div class="row">
          <button id="roomSettingsCancel" class="secondary">取消</button>
          <button id="roomSettingsSave">保存</button>
        </div>
      </div>
    </div>
    <div id="modalBackdrop" class="modal-backdrop"></div>
  <div id="calibrationModal" class="modal">
    <header>自动设置阈值</header>
    <div style="padding:15px;text-align:center;">
        <p id="calibInstruction">请点击开始，并保持环境安静。</p>
        <div id="calibProgress" style="width:100%;height:10px;background:#333;margin:10px 0;border-radius:5px;overflow:hidden;">
            <div id="calibBar" style="width:0%;height:100%;background:#4CAF50;transition:width 0.1s;"></div>
        </div>
        <div id="calibStatus" style="font-size:12px;color:#aaa;">准备就绪</div>
    </div>
    <div class="actions">
      <button id="calibCancel" class="secondary">取消</button>
      <button id="calibAction">开始</button>
    </div>
  </div>
  <div id="channelModal" class="modal">
    <header>创建频道</header>
    <div class="row">
      <input id="channelNameInput" placeholder="请输入频道ID" />
    </div>
    <div id="channelErr" style="color:#ffb020;font-size:12px;display:none;">错误</div>
    <div class="actions">
      <button id="channelCancel" class="secondary">取消</button>
      <button id="channelConfirm">确定</button>
    </div>
  </div>
  <div id="groupModal" class="modal">
    <header>创建分组</header>
    <div class="row">
      <input id="groupNameInput" placeholder="请输入分组名称" />
    </div>
    <div id="groupErr" style="color:#ffb020;font-size:12px;display:none;">错误</div>
    <div class="actions">
      <button id="groupCancel" class="secondary">取消</button>
      <button id="groupConfirm">确定</button>
    </div>
  </div>
  <script>
    (function(){
      var s=document.createElement('script');
      s.src='/assets/js/app.js?v='+Date.now();
      s.async=true;
      document.body.appendChild(s);
    })();
  </script>
  
</body>
</html>
